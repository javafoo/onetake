name: CI

# Typecheck, lint and unit tests. `pnpm test` is node:test through tsx over pure
# functions; the Postgres-backed cases skip themselves without a DATABASE_URL.

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `next typegen` writes .next/types, which tsconfig.json includes and
      # `tsc --noEmit` therefore needs. Nothing here reaches the network.
      - name: Typegen
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec eslint src scripts --max-warnings 0

      - name: Unit tests
        run: pnpm test
